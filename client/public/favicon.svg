<!--
  CryptoStore's default mark, full detail.

  Used at 512, 192, 180 and 48 px, and served as-is for `favicon.svg`. The two
  smaller siblings beside this file are the same mark with detail removed for
  sizes where it would turn to mud — see scripts/tools/build-icons.mjs.

  This is the SHIPPED DEFAULT, deliberately generic: every self-hosted install
  starts here, and an operator's own artwork replaces it by uploading a PWA
  icon in the admin panel. Nothing store-specific belongs in this file.

  Palette is the Ledger default from client/src/theme/defaults.js — graphite
  ground (#111113 family), electric indigo (#7e8dff family), warm paper-white
  (#ecebe7). Hard-coded rather than themed on purpose: a favicon is fetched by
  the browser outside the page, so it cannot read a custom property, and an
  icon that tracked the operator's palette would still be wrong the moment they
  changed it.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c22"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#aeb8ff"/>
      <stop offset="1" stop-color="#6473f2"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="114" fill="url(#tile)"/>
  <rect x="5" y="5" width="502" height="502" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.11" stroke-width="10"/>
  <g transform="translate(256 258)">
    <path d="M 0 -124 a 124 124 0 1 0 96 202" fill="none" stroke="url(#ink)" stroke-width="52" stroke-linecap="round"/>
    <rect x="-23" y="-168" width="46" height="336" rx="23" fill="#ecebe7"/>
  </g>
</svg>
